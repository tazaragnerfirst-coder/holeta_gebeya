<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Holeta Map – Sample</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#fff;color:#1f1f1f}
  #map{position:absolute;inset:0}
  .top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .note{pointer-events:auto;background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .chips{pointer-events:auto;display:flex;gap:2px;padding:5px;background:#EBEEF8;border-radius:100px;overflow-x:auto;box-shadow:0 2px 10px rgba(0,0,0,.14)}
  .chip{flex:0 0 auto;border:none;background:transparent;padding:8px 13px;border-radius:100px;font-size:13px;font-weight:700;color:#1f1f1f}
  .chip.on{background:#D9E1FB;color:#2F4FC4}
  .bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:14px;display:flex;gap:8px}
  .btn{flex:1;border:none;border-radius:100px;padding:13px 10px;font-size:14px;font-weight:700;background:#3F63E0;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .btn.alt{background:#fff;color:#2F4FC4}
  .leaflet-popup-content{font-size:13px;line-height:1.4}
  .lbl{transform:translate(-50%,-50%);white-space:nowrap;font-size:10.5px;color:#5c5a52;text-shadow:0 0 3px #F6F4EE,0 0 3px #F6F4EE,0 0 3px #F6F4EE;pointer-events:none}
  .lbl.place{font-size:13px;font-weight:700;color:#2F4FC4;letter-spacing:.3px}
  .leaflet-container{font-family:system-ui,sans-serif}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="note">ይህ <b>ናሙና</b> ነው። ፒኖቹ የሀሰት ምሳሌ ናቸው፣ እውነተኛ ቦታ አይደሉም። የካርታውን ዝርዝር (ጎዳና፣ ህንጻ፣ ምልክት ቦታ) በሆለታ ላይ ተመልከት።</div>
  <div class="chips" id="chips"></div>
</div>
<div class="bottom">
  <button class="btn alt" id="near">📍 ከእኔ ቅርብ</button>
  <button class="btn" id="drop">＋ ቦታ ምረጥ</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Own-styled Holeta map: no tile server. Data = holeta-map.json (OSM extract of the town only).
  var map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: false, zoomSnap: 0.5 });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: false }).addAttribution('Map data © OpenStreetMap contributors').addTo(map);
  document.getElementById('map').style.background = '#F6F4EE';

  var CENTER = [9.05, 38.50];
  var ITEMS = [], layer = L.layerGroup().addTo(map), current = 'all';
  var COLORS = { store: '#3F63E0', rent: '#E07A3F', product: '#2E9E5B', job: '#9B4FD0' };
  var LABELS = { all: 'ሁሉም', store: 'ሱቅ', rent: 'ኪራይ', product: 'ምርት', job: 'ስራ' };

  // --- our own style ---
  var ROAD_W = { motorway: 7, trunk: 7, primary: 6, secondary: 5, tertiary: 4, residential: 4, unclassified: 4, service: 3, track: 2.5, path: 2, footway: 2 };
  function styleFor(f) {
    var p = f.properties, t = f.geometry.type;
    if (p.waterway || p.natural === 'water') return { color: '#9CC6EC', weight: p.waterway ? 2 : 1, fillColor: '#BFD9F2', fillOpacity: 1 };
    if (p.building) return { color: '#D6CFBF', weight: 0.6, fillColor: '#E6E0D2', fillOpacity: 1 };
    if (p.landuse || p.natural || p.leisure) {
      var green = /forest|grass|meadow|park|recreation|wood|scrub|grassland|pitch|playground|farmland|orchard/.test([p.landuse, p.natural, p.leisure].join(' '));
      return { color: 'transparent', weight: 0, fillColor: green ? '#DCEBD2' : '#EFEBDD', fillOpacity: 1 };
    }
    if (p.highway) { var w = ROAD_W[p.highway] || 2; return { color: '#FFFFFF', weight: w, opacity: 1, lineCap: 'round' }; }
    return { color: '#ccc', weight: 1 };
  }
  var ORDER = function (f) { var p = f.properties; return p.landuse||p.natural==='wood'||p.leisure ? 0 : p.waterway||p.natural==='water' ? 1 : p.highway ? 3 : p.building ? 2 : 4; };

  function setItems(c) {
    var o = [[ .004, .006,'store',true,'ምሳሌ ሱቅ A'],[-.005,.002,'store',true,'ምሳሌ ሱቅ B'],[.008,-.004,'rent',false,'ምሳሌ ቤት ኪራይ'],
             [-.009,-.007,'rent',false,'ምሳሌ ቤት ኪራይ 2'],[.001,-.009,'product',false,'ምሳሌ ምርት'],[-.002,.010,'job',true,'ምሳሌ ስራ']];
    ITEMS = o.map(function (x) { return { ll: [c[0]+x[0]*0.6, c[1]+x[1]*0.6], cat: x[2], exact: x[3], name: x[4] }; });
  }
  function draw() {
    layer.clearLayers();
    ITEMS.forEach(function (it) {
      if (current !== 'all' && it.cat !== current) return;
      var col = COLORS[it.cat];
      var note = it.exact ? 'ትክክለኛ ቦታ ይታያል' : 'ግምታዊ ሰፈር ብቻ (ክብ)';
      if (it.exact) L.circleMarker(it.ll, { radius: 10, color: '#fff', weight: 3, fillColor: col, fillOpacity: 1 }).bindPopup('<b>' + it.name + '</b><br>' + note).addTo(layer);
      else L.circle(it.ll, { radius: 250, color: col, weight: 2, fillColor: col, fillOpacity: .2 }).bindPopup('<b>' + it.name + '</b><br>' + note).addTo(layer);
    });
  }

  var chips = document.getElementById('chips');
  Object.keys(LABELS).forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'chip' + (k === current ? ' on' : '');
    b.textContent = LABELS[k];
    b.onclick = function () {
      current = k;
      Array.prototype.forEach.call(chips.children, function (c) { c.classList.remove('on'); });
      b.classList.add('on'); draw();
    };
    chips.appendChild(b);
  });

  var note = document.querySelector('.note');
  fetch('holeta-map.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    var bb = data.meta.bbox;
    var bounds = L.latLngBounds([bb.south, bb.west], [bb.north, bb.east]);
    // polygons/lines first (by layer order), points later as labels
    var shapes = data.features.filter(function (f) { return f.geometry.type !== 'Point'; }).sort(function (a, b) { return ORDER(a) - ORDER(b); });
    var land = shapes.filter(function (f) { return !f.properties.highway; });
    var roads = shapes.filter(function (f) { return f.properties.highway; });
    L.geoJSON({ type: 'FeatureCollection', features: land }, { style: styleFor, interactive: false }).addTo(map);
    // roads: darker casing underneath, white road on top, so they read on the cream background
    L.geoJSON({ type: 'FeatureCollection', features: roads }, { interactive: false, style: function (f) {
      var w = ROAD_W[f.properties.highway] || 3; return { color: '#C9C2B0', weight: w + 3, opacity: 1, lineCap: 'round', lineJoin: 'round' }; } }).addTo(map);
    L.geoJSON({ type: 'FeatureCollection', features: roads }, { interactive: false, style: function (f) {
      var w = ROAD_W[f.properties.highway] || 3; return { color: '#FFFFFF', weight: w + 1, opacity: 1, lineCap: 'round', lineJoin: 'round' }; } }).addTo(map);
    var label = L.layerGroup().addTo(map);
    data.features.filter(function (f) { return f.geometry.type === 'Point' && (f.properties['name:am'] || f.properties.name); }).forEach(function (f) {
      var p = f.properties, g = f.geometry.coordinates, isPlace = !!p.place;
      L.marker([g[1], g[0]], { interactive: false, icon: L.divIcon({ className: '', html: '<div class="lbl' + (isPlace ? ' place' : '') + '">' + (p['name:am'] || p.name) + '</div>' }) }).addTo(label);
    });
    map.setMaxBounds(bounds.pad(0.15)); map.setMinZoom(13); map.fitBounds(bounds);
    var c = bounds.getCenter(); setItems([c.lat, c.lng]); draw();
    note.innerHTML = 'ይህ <b>ናሙና</b> ነው። ካርታው የሆለታ ከተማ ብቻ ነው፣ በራሳችን ዲዛይን። ፒኖቹ ሀሰተኛ ምሳሌ ናቸው። (' + data.meta.count + ' ነገሮች)';
  }).catch(function () {
    map.setView(CENTER, 14); setItems(CENTER); draw();
    note.innerHTML = 'የሆለታ ካርታ ዳታ ገና አልተፈጠረም። GitHub → Actions → <b>Build Holeta Map Data</b> → Run workflow ሩጥ፣ ከዛ ገጹን አድስ።';
  });

  // "Near me": sort-by-distance idea, here just locate the person.
  var me;
  document.getElementById('near').onclick = function () {
    if (!navigator.geolocation) { alert('ይህ ብሮውዘር ቦታ አይደግፍም'); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      var ll = [p.coords.latitude, p.coords.longitude];
      if (me) map.removeLayer(me);
      me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1E88E5', fillOpacity: 1 }).addTo(map).bindPopup('አንተ እዚህ ነህ').openPopup();
      map.setView(ll, 15);
    }, function () { alert('ቦታህን ማግኘት አልተቻለም (ፍቃድ ስጥ)'); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  // "Pick a place": tap the map to drop a pin (what a seller would do when posting).
  var picking = false, pin;
  var dropBtn = document.getElementById('drop');
  dropBtn.onclick = function () {
    picking = !picking;
    dropBtn.textContent = picking ? 'ካርታው ላይ ንካ…' : '＋ ቦታ ምረጥ';
  };
  map.on('click', function (e) {
    if (!picking) return;
    if (pin) map.removeLayer(pin);
    pin = L.marker(e.latlng).addTo(map)
      .bindPopup('የተመረጠ ቦታ<br>' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5)).openPopup();
    picking = false;
    dropBtn.textContent = '＋ ቦታ ምረጥ';
  });
</script>
</body>
</html>
