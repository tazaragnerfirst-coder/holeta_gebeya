name: Create admin hosting site (one-time)

# Manual only — run this ONCE from the Actions tab (Actions →
# "Create admin hosting site (one-time)" → Run workflow) before the
# first admin-panel deploy. Safe to re-run: Firebase just reports the
# site already exists.
on:
  workflow_dispatch: {}

jobs:
  create-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > ${{ github.workspace }}/firebase-sa.json

      - name: Create hosting site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          npm install -g firebase-tools
          firebase hosting:sites:create holeta-gebeya-admin --project holeta-c22fc --non-interactive || echo "Site may already exist — that's fine."
