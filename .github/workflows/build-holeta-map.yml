name: Build Holeta Map Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install converter
        run: npm install --no-save --no-audit --no-fund osmtogeojson
        working-directory: .github/scripts

      - name: Download and trim Holeta data
        run: node .github/scripts/fetch-holeta-map.mjs mobile/public/holeta-map.json

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/public/holeta-map.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update Holeta map data (OSM extract)"
          git push
