name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'frontend/public/icons/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund
        working-directory: android-app

      - name: Add Android platform
        run: npx cap add android
        working-directory: android-app

      - name: Apply app icon
        working-directory: android-app
        run: |
          res=android/app/src/main/res
          # Use our own PNG icon instead of Capacitor's default adaptive icon.
          rm -rf "$res"/mipmap-anydpi-v26 "$res"/drawable-v24 "$res"/drawable/ic_launcher_background.xml 2>/dev/null || true
          src=../frontend/public/icons/icon-512.png
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="$res/mipmap-${pair%%:*}"; s="${pair##*:}"
            mkdir -p "$d"
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$src" -resize ${s}x${s} "$d/$n.png"
            done
          done

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: android-app

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk HoletaGebeya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoletaGebeya-apk
          path: HoletaGebeya.apk

      - name: Publish to apk-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest HoletaGebeya.apk \
            --title "Holeta Gebeya (Android APK)" \
            --notes "Latest Android build. Download HoletaGebeya.apk and install it (allow 'Install unknown apps' when asked)."
