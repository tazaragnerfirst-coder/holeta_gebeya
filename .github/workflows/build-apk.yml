# Release-signed APK. Signing key comes from the ANDROID_* repository secrets.
name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'frontend/public/icons/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "Missing GitHub secret for $v"; exit 1; fi
          done

      - name: Install Capacitor
        run: npm install --no-audit --no-fund
        working-directory: android-app

      - name: Add Android platform
        run: npx cap add android
        working-directory: android-app

      - name: Apply app icon
        working-directory: android-app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          res=android/app/src/main/res
          # Use our own PNG icon instead of Capacitor's default adaptive icon.
          rm -rf "$res"/mipmap-anydpi-v26 "$res"/drawable-v24 "$res"/drawable/ic_launcher_background.xml 2>/dev/null || true
          src=../frontend/public/icons/icon-512.png
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="$res/mipmap-${pair%%:*}"; s="${pair##*:}"
            mkdir -p "$d"
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$src" -resize ${s}x${s} "$d/$n.png"
            done
          done

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: android-app

      - name: Configure release signing and version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android-app/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          python3 - <<'EOF'
          import os, re

          path = 'app/build.gradle'
          s = open(path).read()
          vc = os.environ['VERSION_CODE']

          # Every build gets a higher versionCode, so Android installs it over the previous one.
          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {vc}', s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "1.{vc}"', s, count=1)

          # Use the release buildType and point it at the signing config.
          s, n3 = re.subn(r'(buildTypes\s*\{\s*release\s*\{)',
                          r'\1\n            signingConfig signingConfigs.release', s, count=1)

          signing = """    signingConfigs {
                release {
                    storeFile file("release.keystore")
                    storePassword System.getenv("KEYSTORE_PASS")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASS")
                }
            }
        """
          s, n4 = re.subn(r'(\n\s*buildTypes\s*\{)', '\n' + signing + r'\1', s, count=1)

          if not all([n1, n2, n3, n4]):
              raise SystemExit(f'build.gradle patch failed: {n1} {n2} {n3} {n4}')
          open(path, 'w').write(s)
          print('Patched build.gradle: versionCode', vc)
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app/android

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/release/app-release.apk HoletaGebeya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoletaGebeya-apk
          path: HoletaGebeya.apk

      - name: Publish to apk-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest HoletaGebeya.apk \
            --title "Holeta Gebeya (Android APK)" \
            --notes "Latest Android build. Download HoletaGebeya.apk and install it. Future updates install over the top of this one."
