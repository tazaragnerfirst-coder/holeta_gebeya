name: Deploy admin panel

# Runs automatically whenever admin/ (or its hosting config) changes
# on main — this is what replaces manually running
# `firebase deploy --only hosting:admin` from Cloud Shell every time.
# Can also be triggered manually from the Actions tab if needed.
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > ${{ github.workspace }}/firebase-sa.json

      - name: Deploy admin site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:admin --project holeta-c22fc --non-interactive
